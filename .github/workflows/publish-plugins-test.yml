name: Publish Plugins (Test)

on:
  push:
    branches:
      - feat/multisrc-skip-down
    paths:
      - 'plugins/**'
      - 'public/**'
      - 'scripts/publish-plugins.sh'
      - '.github/workflows/publish-plugins-test.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: publish-plugins-test
  cancel-in-progress: true

env:
  DIST_BRANCH: plugins/test

jobs:
  publish:
    name: Publish Plugins (Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/multisrc-skip-down
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Publish Plugins (Test)
        run: npm run publish:plugins 2>> $GITHUB_STEP_SUMMARY
        shell: bash
