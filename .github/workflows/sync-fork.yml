name: Sync Fork

on:
  schedule:
    # Every day at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  UPSTREAM: lnreader/lnreader-plugins
  FEATURE_BRANCH: dev
  SNAPSHOT_BRANCH: ci/upstream-snapshot
  # Abort the sync if an update would delete more than this percentage of files
  MAX_DELETED_PCT: 30

jobs:
  sync:
    name: Sync master, original & dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: master
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add upstream "https://github.com/${UPSTREAM}.git" || git remote set-url upstream "https://github.com/${UPSTREAM}.git"
          git fetch origin master original "$FEATURE_BRANCH"

      - name: Create deletion guard
        run: |
          cat > "$RUNNER_TEMP/guard.sh" <<'EOS'
          guard_deletions() { # <old-commit> <new-commit> <label>
            local total deleted pct
            total=$(git ls-tree -r --name-only "$1" | wc -l)
            deleted=$(git diff --diff-filter=D --name-only "$1" "$2" | wc -l)
            pct=0
            [ "$total" -gt 0 ] && pct=$(( deleted * 100 / total ))
            if [ "$pct" -gt "${MAX_DELETED_PCT:-30}" ]; then
              echo "::error::$3: update would delete $deleted of $total files (${pct}% > ${MAX_DELETED_PCT:-30}%). Possible upstream compromise — aborting without pushing."
              return 1
            fi
            echo "$3: $deleted/$total files deleted (${pct}%)"
          }
          EOS

      - name: Fetch upstream (tolerate upstream disappearing)
        id: upstream
        run: |
          if git fetch upstream master; then
            echo "available=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::upstream/master is unreachable (repo deleted, renamed or private). Leaving all branches untouched."
            echo "available=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify upstream integrity
        if: steps.upstream.outputs.available == '1'
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/master)
          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> "$GITHUB_ENV"
          # History-rewrite check against the last successfully synced upstream commit
          if git fetch origin "$SNAPSHOT_BRANCH" 2>/dev/null; then
            LAST_SYNCED=$(git rev-parse FETCH_HEAD)
            if ! git merge-base --is-ancestor "$LAST_SYNCED" "$UPSTREAM_SHA"; then
              echo "::error::upstream/master no longer contains the last synced commit ($LAST_SYNCED). History was rewritten — possible upstream compromise. Aborting, nothing pushed."
              exit 1
            fi
            echo "upstream/master is a descendant of the last synced commit ($LAST_SYNCED)"
          else
            echo "No snapshot branch yet (first run), skipping rewrite check"
          fi
          # Every synced branch must share history with upstream
          for branch in master original "$FEATURE_BRANCH"; do
            if ! git merge-base "origin/$branch" "$UPSTREAM_SHA" >/dev/null 2>&1; then
              echo "::error::origin/$branch shares no history with upstream/master. Aborting."
              exit 1
            fi
          done

      - name: Sync original (fast-forward only, guarded)
        if: steps.upstream.outputs.available == '1'
        run: |
          source "$RUNNER_TEMP/guard.sh"
          if ! git merge-base --is-ancestor origin/original "$UPSTREAM_SHA"; then
            echo "::error::origin/original has diverged from upstream/master; it must stay a pristine copy. Skipping."
            exit 1
          fi
          if ! guard_deletions origin/original "$UPSTREAM_SHA" "original sync"; then
            exit 1
          fi
          if [ "$(git rev-parse origin/original)" != "$UPSTREAM_SHA" ]; then
            git push origin "$UPSTREAM_SHA:refs/heads/original"
            echo "original fast-forwarded to upstream/master"
          else
            echo "original already up to date"
          fi

      - name: Sync master (fast-forward or merge from upstream, guarded)
        if: steps.upstream.outputs.available == '1'
        run: |
          source "$RUNNER_TEMP/guard.sh"
          git checkout -B master origin/master
          if git merge --ff-only upstream/master 2>/dev/null; then
            echo "master fast-forwarded to upstream/master"
          elif git merge --no-edit upstream/master; then
            echo "master merged upstream/master (local commits preserved)"
          else
            echo "::error::Merge conflict in master. Resolve manually."
            git merge --abort
            exit 1
          fi
          if ! guard_deletions origin/master master "master sync"; then
            git reset --hard origin/master
            exit 1
          fi
          if [ "$(git rev-parse master)" != "$(git rev-parse origin/master)" ]; then
            git push origin master
          else
            echo "master already up to date"
          fi

      - name: Sync dev (merge upstream, guarded)
        if: steps.upstream.outputs.available == '1'
        run: |
          source "$RUNNER_TEMP/guard.sh"
          git checkout -B "$FEATURE_BRANCH" "origin/$FEATURE_BRANCH"
          if git merge-base --is-ancestor "$UPSTREAM_SHA" "$FEATURE_BRANCH"; then
            echo "$FEATURE_BRANCH already contains upstream/master"
            exit 0
          fi
          if ! git merge --no-edit upstream/master; then
            echo "::error::Merge conflict in $FEATURE_BRANCH. Resolve manually."
            git merge --abort
            exit 1
          fi
          if ! guard_deletions "origin/$FEATURE_BRANCH" "$FEATURE_BRANCH" "$FEATURE_BRANCH sync"; then
            git reset --hard "origin/$FEATURE_BRANCH"
            exit 1
          fi
          if [ "$(git rev-parse "$FEATURE_BRANCH")" != "$(git rev-parse "origin/$FEATURE_BRANCH")" ]; then
            git push origin "$FEATURE_BRANCH"
            echo "$FEATURE_BRANCH synced with upstream/master"
          fi

      - name: Save upstream snapshot (only after a successful sync)
        if: steps.upstream.outputs.available == '1'
        run: git push --force origin "$UPSTREAM_SHA:refs/heads/$SNAPSHOT_BRANCH"

  build-test:
    name: Publish plugins
    needs: sync
    uses: ./.github/workflows/publish-plugins-test.yml
    permissions:
      contents: write
